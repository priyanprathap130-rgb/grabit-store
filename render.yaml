services:
  - type: web
    name: grabit-store
    runtime: python
    plan: 1c-2g
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask db upgrade && flask seed-defaults
    startCommand: gunicorn --workers 2 --threads 2 --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13
      - key: FLASK_APP
        value: app.py
      - key: AUTO_INIT_LOCAL_DB
        value: "0"
      - key: APP_SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: grabit-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

databases:
  - name: grabit-db
    plan: 0.5c-1g
