<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRABIT</title><link rel="stylesheet" href="/styles.css"><script src="https://checkout.razorpay.com/v1/checkout.js"></script></head><body>
<div id="announcement" class="announcement"></div><header><a class="logo" href="/">GRABIT</a><nav><a href="#shop">Shop</a><button id="cartBtn" class="cartBtn">Cart <span id="cartCount">0</span></button></nav></header>
<main><section class="hero"><div><p class="eyebrow">WELCOME TO GRABIT</p><h1 id="heroTitle">Shop smart. GRAB it.</h1><p id="heroSubtitle">Discover useful products at great prices.</p><a href="#shop" class="btn">Shop Now</a></div></section>
<section id="shop" class="shop"><div class="shopHead"><div><p class="eyebrow">OUR PRODUCTS</p><h2>Find your next favourite</h2></div><input id="search" placeholder="Search products..."></div><div id="categories" class="categories"></div><div id="products" class="grid"></div><div id="empty" class="empty hidden">No products found.</div></section></main>
<footer><div><b>GRABIT</b><p id="tagline"></p></div><div id="contact"></div><p>© <span id="year"></span> GRABIT</p></footer>
<div id="cartPanel" class="drawer"><div class="drawerTop"><h3>Your Cart</h3><button onclick="closeCart()">×</button></div><div id="cartItems"></div><div class="cartSummary"><div><span>Subtotal</span><b id="cartSubtotal">₹0</b></div><button class="btn full" onclick="openCheckout()">Proceed to Checkout</button></div></div><div id="overlay" class="overlay" onclick="closeCart()"></div>
<div id="checkoutModal" class="modalWrap hidden"><div class="modal"><button class="close" onclick="closeCheckout()">×</button><h2>Checkout</h2><p class="muted">Enter your delivery details.</p><form id="checkoutForm"><input name="name" placeholder="Full name" required><input name="phone" placeholder="Phone number" required><input name="email" type="email" placeholder="Email (optional)"><textarea name="address" placeholder="Delivery address" required></textarea><div class="two"><input name="city" placeholder="City"><input name="pincode" placeholder="PIN code"></div><div class="coupon"><input id="coupon" placeholder="Coupon code"><button type="button" onclick="applyCoupon()">Apply</button></div><div id="checkoutTotal" class="totalLine"></div><button class="btn full" type="submit">Pay securely with Razorpay</button><small>Payments are processed securely by Razorpay.</small></form></div></div>
<div id="toast" class="toast"></div><script src="/app.js"></script></body></html>
