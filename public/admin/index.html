<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRABIT Admin</title><link rel="stylesheet" href="/admin/admin.css"></head><body><div id="login" class="login"><div class="loginBox"><div class="brand">GRABIT</div><h1>Store Admin</h1><p>Manage your store without coding.</p><form id="loginForm"><input name="email" type="email" placeholder="Admin email" required><input name="password" type="password" placeholder="Password" required><button>Sign in</button></form><small id="loginErr"></small></div></div><div id="app" class="app hidden"><aside><div class="brand">GRABIT</div><button data-tab="dashboard">Dashboard</button><button data-tab="products">Products</button><button data-tab="orders">Orders</button><button data-tab="settings">Store Settings</button><a href="/" target="_blank">View Store ↗</a><button id="logout">Log out</button></aside><main><div class="mobileTop"><b>GRABIT Admin</b><a href="/">Store</a></div><section id="dashboard" class="tab"><h1>Dashboard</h1><div id="stats" class="stats"></div><div class="panel"><h2>Recent orders</h2><div id="recent"></div></div></section><section id="products" class="tab hidden"><div class="sectionHead"><div><h1>Products</h1><p>Add and manage everything you sell.</p></div><button class="primary" onclick="openProduct()">+ Add Product</button></div><div id="productTable" class="panel"></div></section><section id="orders" class="tab hidden"><div class="sectionHead"><div><h1>Orders</h1><p>Track payments and fulfilment.</p></div></div><div id="orderTable" class="panel"></div></section><section id="settings" class="tab hidden"><div class="sectionHead"><div><h1>Store Settings</h1><p>Change your storefront information without editing code.</p></div><button class="primary" onclick="saveSettings()">Save Changes</button></div><div class="panel formGrid" id="settingsForm"></div></section></main></div><div id="productModal" class="modal hidden"><div class="box"><button class="x" onclick="closeProduct()">×</button><h2 id="productTitle">Add Product</h2><form id="productForm"><input type="hidden" name="id"><label>Product name<input name="name" required></label><label>Category<input name="category" placeholder="Electronics, Fashion..." required></label><div class="two"><label>Selling price<input name="price" type="number" min="0" step="0.01" required></label><label>Compare-at price<input name="compareAtPrice" type="number" min="0" step="0.01"></label></div><label>Stock quantity<input name="stock" type="number" min="0" step="1" required></label><label>Product image URL<input name="image" placeholder="https://example.com/product.jpg"></label><label>Description<textarea name="description"></textarea></label><label class="check"><input name="active" type="checkbox" checked> Visible in store</label><button class="primary">Save Product</button></form></div></div><div id="toast" class="toast"></div><script src="/admin/admin.js"></script></body></html>
